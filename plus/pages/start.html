<!DOCTYPE html>
<!-- about:zenith-start: Zenith's startpage (Zenith Plus › Start page). -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Start</title>
    <link rel="icon" href="chrome://browser/skin/zen-icons/home.svg" />
    <link rel="stylesheet" href="start.css" />
    <script type="module" src="start.mjs"></script>
  </head>
  <body>
    <main>
      <div id="clock"></div>
      <div id="greeting"></div>
      <div id="weather" hidden></div>
      <div id="box">
        <input id="q" type="search" placeholder="Search, or type an address" autofocus spellcheck="false" autocomplete="off"
               role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="false" />
        <ol id="results" role="listbox" hidden></ol>
      </div>
      <nav id="top" hidden></nav>
      <ol id="marks"></ol>
      <p id="hint"></p>
    </main>
  </body>
</html>
