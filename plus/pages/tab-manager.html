<!DOCTYPE html>
<!-- about:zenith-tabs: Zenith's tab manager (zenith-tabs.uc.mjs opens it). -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Tabs</title>
    <link rel="icon" href="chrome://browser/skin/zen-icons/tab.svg" />
    <link rel="stylesheet" href="tab-manager.css" />
    <script type="module" src="tab-manager.mjs"></script>
  </head>
  <body>
    <header id="top">
      <div class="title">
        <h1>Tabs</h1>
        <span id="summary"></span>
      </div>
      <input id="search" type="search" placeholder="Find a tab" spellcheck="false" />
      <button type="button" id="undo" class="quiet" hidden>Undo</button>
      <nav id="views" role="tablist">
        <button type="button" data-view="tabs" role="tab">All tabs</button>
        <button type="button" data-view="spaces" role="tab">Spaces</button>
        <button type="button" data-view="tidy" role="tab">Tidy up</button>
        <button type="button" data-view="rules" role="tab">Rules</button>
      </nav>
      <button type="button" id="close" class="quiet" title="Close this page">✕</button>
    </header>
    <main id="tabs" class="view" data-scroll="tabs">
      <section id="insights"></section>
      <div id="filters"></div>
      <div id="table"></div>
    </main>
    <main id="spaces" class="view" hidden>
      <div id="board" data-scroll="board"></div>
    </main>
    <main id="tidy" class="view" data-scroll="tidy" hidden></main>
    <main id="rules" class="view" data-scroll="rules" hidden></main>
    <div id="bar" hidden></div>
    <div id="menu" hidden></div>
    <div id="note" hidden></div>
  </body>
</html>
